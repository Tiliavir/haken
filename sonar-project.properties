# SonarQube Cloud: runs in CI when the SONAR_TOKEN secret is set (.github/workflows/ci.yml).
sonar.organization=tiliavir
sonar.projectKey=Tiliavir_haken
sonar.sources=web/src,gateway
sonar.tests=tests,gateway
sonar.exclusions=gateway/**/*_test.go,gateway/cmd/haken/dist/**
sonar.test.inclusions=tests/**,gateway/**/*_test.go
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.go.coverage.reportPaths=coverage/go.out
