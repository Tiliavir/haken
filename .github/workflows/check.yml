name: check

# The full check (tools/ci.sh); used by ci.yml and release.yml.
on:
  workflow_call:

permissions:
  contents: read
  packages: read # the CI image on ghcr.io

jobs:
  check:
    runs-on: ubuntu-24.04
    # tools/ci.Dockerfile, built by ci-image.yml from 14334047c6f009ce3ccb4eb128cea2efce55fba1.
    container:
      image: ghcr.io/tiliavir/haken-ci@sha256:dd6d292261f2de581347c21e032e84ed59ecb043ff2c28a544c67a01ae9f9802
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      PLAYWRIGHT_CHANNEL: chromium
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Sonar attributes new code by history
      # The container runs as root, the checkout belongs to the runner user:
      # without this git refuses the repository and go build/list fail on VCS stamping.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: playwright
        run: >-
          node -e 'const v = require("./package-lock.json").packages["node_modules/playwright-core"]?.version;
          if (!v) throw new Error("playwright-core missing in package-lock.json");
          console.log("version=" + v)' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - run: tools/ci.sh
      - run: make coverage
      # Only where the secret exists (not on forks).
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
