name: check

# The full check (tools/ci.sh); used by ci.yml and release.yml.
on:
  workflow_call:

permissions:
  contents: read
  packages: read # the CI image on ghcr.io

jobs:
  check:
    runs-on: ubuntu-24.04
    # tools/ci.Dockerfile, built by ci-image.yml from 7e250a4ff9aaa74fce9a8417e5c497ac8203dd8f.
    container:
      image: ghcr.io/tiliavir/haken-ci@sha256:3a35e71ebccbdca3a4be879718ed2ca09c77239a1dff07c07696d6239236125a
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      PLAYWRIGHT_CHANNEL: chromium
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Sonar attributes new code by history
      # The container runs as root, the checkout belongs to the runner user:
      # without this git refuses the repository and go build/list fail on VCS stamping.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: tools/ci.sh
      - run: make coverage
      # Only where the secret exists (not on forks).
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
