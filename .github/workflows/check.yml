name: check

# The full check (tools/ci.sh); used by ci.yml and release.yml.
on:
  workflow_call:

permissions:
  contents: read
  packages: read # the CI image on ghcr.io

jobs:
  check:
    runs-on: ubuntu-24.04
    # tools/ci.Dockerfile, built by ci-image.yml from 7a334490e7ff0c6c1762819925a641bbb18010d5.
    container:
      image: ghcr.io/tiliavir/haken-ci@sha256:4ac7b4dcbb30d387b7e2fb3a69c6cf7c64a8a66c0177d5fd501db277a7c90471
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      PLAYWRIGHT_CHANNEL: chromium
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Sonar attributes new code by history
      # The container runs as root, the checkout belongs to the runner user:
      # without this git refuses the repository and go build/list fail on VCS stamping.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: tools/ci.sh
      - run: make coverage
      # Only where the secret exists (not on forks).
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
