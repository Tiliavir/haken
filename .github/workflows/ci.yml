name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # Pinned image: Node, Playwright browsers. Go, Java and Radicale are installed pinned below.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      # The container runs as root, the checkout belongs to the runner user:
      # without this git refuses the repository and go build/list fail on VCS stamping.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
      - name: Java and Radicale
        run: |
          apt-get update && apt-get install -y --no-install-recommends openjdk-17-jre-headless python3-pip make
          pip install --break-system-packages radicale==3.9.0
      - run: npm ci
      - run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - run: make check
      - run: cd gateway && "$(go env GOPATH)/bin/staticcheck" ./...

  pages:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: make build-demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - uses: actions/deploy-pages@v4
